name: spring3

on:
  push:
    branches:
      - feature/jeanne-integration
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spring3/package-lock.json
      - run: npm ci
      - run: npm run build
